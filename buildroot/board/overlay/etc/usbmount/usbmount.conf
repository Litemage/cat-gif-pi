# usbmount configuration for cat_gif.
ENABLED=1

MOUNTPOINTS="/media/usb0 /media/usb1 /media/usb2 /media/usb3
             /media/usb4 /media/usb5 /media/usb6 /media/usb7"

# exfat is not supported.
FILESYSTEMS="vfat ext2 ext3 ext4"

MOUNTOPTIONS="noexec,nodev,noatime,nodiratime"

# BusyBox mount only takes numeric ids. 1000 is gifuser, the first account
# created from board/users_table.txt. vfat has no owners, so this makes the
# stick writable by the app; ext* sticks must already be writable by gifuser.
FS_MOUNTOPTIONS="-fstype=vfat,uid=1000,gid=1000,umask=0002"

VERBOSE=no
