# cat_gif directories. Edit with: vi /etc/cat-gif.conf
# Changes are picked up within a few seconds, no restart needed.
#
# Line 1: directory cat_gif takes new GIFs from
# Line 2: directory cat_gif moves used GIFs to
#
# usbmount mounts the first stick at /media/usb0, the next at /media/usb1, ...
/media/usb0/gifs/new
/media/usb0/gifs/used
